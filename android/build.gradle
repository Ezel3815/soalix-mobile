allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // file_picker (11.0.0–11.0.3) ships Kotlin source but forgets to apply
    // the Kotlin compiler plugin to itself, so its class never compiles.
    // This has to run here, before file_picker's own build.gradle configures
    // itself - doing it inside afterEvaluate (below) is too late and breaks
    // Kotlin's plugin lifecycle.
    if (project.name == "file_picker") {
        project.apply plugin: "org.jetbrains.kotlin.android"
    }

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
        // Force every plugin (file_picker, etc.) to build with the same
        // Java/Kotlin version as the app itself, so they stop disagreeing.
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
